version: '3'

services:
  nextjs:
    container_name: nextjs-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    # Method 1: Use env_file to load all variables from .env.local
    env_file:
      - .env.local
    # Method 2: Mount the .env.local file into the container (alternative approach)
    # volumes:
    #   - ./.env.local:/app/.env.local
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge